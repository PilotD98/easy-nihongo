name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate curriculum content
        run: node scripts/validate-content.mjs

      - name: Check for secrets in the repository
        run: |
          # Fails if anything that looks like an API key or token is committed.
          if grep -rEn --exclude-dir=.git --exclude-dir=_site --exclude=deploy.yml \
               -e 'sk-[A-Za-z0-9]{20,}' -e 'AIza[0-9A-Za-z_-]{30,}' -e 'ghp_[A-Za-z0-9]{30,}' -e 'AKIA[0-9A-Z]{16}' . ; then
            echo "Possible secret found. Remove it before deploying."; exit 1; fi

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude node_modules --exclude scripts ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
